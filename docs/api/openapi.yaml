openapi: 3.1.0
info:
  title: AI Resume and Interview Coach API
  version: 0.1.0
  summary: API contract for implemented Phase 1–5 workflows and planned operations
  description: >-
    Candidate preparation, intake, AI-assisted analysis, interviews, and coach review
    are implemented. Some privacy and administration operations remain target-only.
    AI workflows require a configured provider and active external-model-processing
    consent; the disabled provider is the default.
servers:
  - url: /api/v1
    description: API base path
tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Resumes
  - name: Jobs
  - name: Matching
  - name: Skills
  - name: Suggestions
  - name: Interviews
  - name: Candidates
  - name: Reviews
  - name: Administration
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API liveness
      security: []
      responses:
        "200":
          description: API process is responsive
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [status, timestamp]
                    properties:
                      status:
                        const: ok
                      timestamp:
                        type: string
                        format: date-time
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a candidate account
      description: Public registration never accepts a caller-selected role.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Candidate account created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [user]
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and issue an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [accessToken, tokenType, user]
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        const: Bearer
                      user:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's safe profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /resumes/upload:
    post:
      tags: [Resumes]
      summary: Upload a resume and extract its source text
      description: Candidate only. Requires a current, stored resume-processing consent before multipart parsing. PDF/DOCX only; files are validated and stored privately. CV-based AI processing fails closed until an anonymization adapter is configured.
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Upload stored and source text extracted
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [resume]
                    properties:
                      resume:
                        $ref: "#/components/schemas/Resume"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /resumes:
    get:
      tags: [Resumes]
      summary: List the candidate's resumes
      x-roles: [candidate]
      responses:
        "200":
          description: Owned resume metadata
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Resume"
                      nextCursor:
                        type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /resumes/{resumeId}:
    parameters:
      - $ref: "#/components/parameters/ResumeId"
    get:
      tags: [Resumes]
      summary: Get an owned resume and extracted source text
      responses:
        "200":
          description: Resume metadata, parse status, and evidence-backed content
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [resume]
                    properties:
                      resume:
                        $ref: "#/components/schemas/Resume"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags: [Resumes]
      summary: Update candidate-editable resume title or notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeCorrection"
      responses:
        "200":
          description: Corrected resume data
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [resume]
                    properties:
                      resume:
                        $ref: "#/components/schemas/Resume"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /jobs/analyze:
    post:
      tags: [Jobs]
      summary: Persist a job description and queue its analysis
      description: Queues asynchronous job-description analysis. Requires an enabled AI provider and external-model-processing consent.
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobTextRequest"
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, DOCX, or UTF-8 TXT
      responses:
        "202":
          description: Analysis queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [Jobs]
      summary: List the candidate's job descriptions
      responses:
        "200":
          description: Owned job descriptions
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/JobDescription"
                      nextCursor:
                        type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /jobs/status/{jobId}:
    get:
      tags: [Jobs]
      summary: Poll status of an owned asynchronous task
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Current task state
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/JobStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /jobs/{jobDescriptionId}:
    get:
      tags: [Jobs]
      summary: Get one owned job description
      parameters:
        - name: jobDescriptionId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Job description and analysis
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/JobDescription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /matching/analyze:
    post:
      tags: [Matching]
      summary: Start evidence-checked match analysis
      description: The final score is computed by code and is not a hiring decision.
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchRequest"
      responses:
        "202":
          description: Match analysis queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /matches/{matchId}:
    get:
      tags: [Matching]
      summary: Get an owned match result with evidence and score breakdown
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Match analysis
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/MatchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /skills/gaps:
    post:
      tags: [Skills]
      summary: Start learning-oriented skill gap analysis
      description: Missing resume evidence is described as no evidence found, not as lack of skill.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchRequest"
      responses:
        "202":
          description: Gap analysis queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /skills/gaps/{gapId}:
    get:
      tags: [Skills]
      summary: Get an owned skill gap result
      parameters:
        - name: gapId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Gap categories and suggested learning actions
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/SkillGapResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /resumes/optimize:
    post:
      tags: [Resumes]
      summary: Generate evidence-backed resume suggestions
      description: Suggestions are pending candidate acceptance and cannot introduce unsupported facts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeResumeRequest"
      responses:
        "202":
          description: Suggestions queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /resumes/{resumeId}/draft:
    parameters:
      - $ref: "#/components/parameters/ResumeId"
    get:
      tags: [Resumes]
      summary: Generate a text CV draft using accepted suggestions only
      description: Requires current resume-processing consent when accepted suggestions need to be applied.
      parameters:
        - name: jobDescriptionId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Draft based on the owned resume and its accepted suggestions
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [resumeId, jobDescriptionId, content, appliedSuggestionIds]
                    properties:
                      resumeId:
                        $ref: "#/components/schemas/ObjectId"
                      jobDescriptionId:
                        $ref: "#/components/schemas/ObjectId"
                      content:
                        type: string
                      appliedSuggestionIds:
                        type: array
                        items:
                          $ref: "#/components/schemas/ObjectId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /suggestions:
    get:
      tags: [Suggestions]
      summary: List the candidate's resume suggestions
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Owned suggestions
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ResumeSuggestion"
                      nextCursor:
                        type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /suggestions/{suggestionId}/decision:
    post:
      tags: [Suggestions]
      summary: Accept or reject one resume suggestion
      parameters:
        - name: suggestionId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [accept, reject]
      responses:
        "200":
          description: Candidate decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /interviews/generate:
    post:
      tags: [Interviews]
      summary: Generate an interview question set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewGenerateRequest"
      responses:
        "202":
          description: Question generation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /interviews/question-sets/{questionSetId}:
    get:
      tags: [Interviews]
      summary: Retrieve an owned generated question set
      parameters:
        - name: questionSetId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Generated question set
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [id, questions]
                    properties:
                      id:
                        $ref: "#/components/schemas/ObjectId"
                      questions:
                        type: array
                        items:
                          $ref: "#/components/schemas/InterviewQuestion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /interviews:
    post:
      tags: [Interviews]
      summary: Start a mock interview and return the first question
      description: Starts or resumes the LangGraph workflow with thread_id equal to sessionId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInterviewRequest"
      responses:
        "201":
          description: Interview session created and paused for an answer
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/InterviewSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /interviews/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ObjectId"
    get:
      tags: [Interviews]
      summary: Get an owned interview session
      responses:
        "200":
          description: Session and current question/status
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/InterviewSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /interviews/{sessionId}/answer:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ObjectId"
    post:
      tags: [Interviews]
      summary: Submit an answer to the current question
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answerText]
              properties:
                answerText:
                  type: string
                  minLength: 1
                  maxLength: 20000
      responses:
        "200":
          description: Answer recorded and graph resumed
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [waiting_for_answer, evaluating, completed]
                      nextQuestion:
                        oneOf:
                          - $ref: "#/components/schemas/InterviewQuestion"
                          - type: "null"
                      evaluation:
                        $ref: "#/components/schemas/AnswerEvaluation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /interviews/{sessionId}/evaluate:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ObjectId"
    post:
      tags: [Interviews]
      summary: End early or request final interview evaluation
      responses:
        "202":
          description: Evaluation queued or graph resumed into evaluation branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /interviews/{sessionId}/results:
    get:
      tags: [Interviews]
      summary: Get interview evaluation results
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Evaluation report and review status
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/InterviewResults"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /candidates/me/progress:
    get:
      tags: [Candidates]
      summary: Get the candidate's aggregate preparation progress
      x-roles: [candidate]
      responses:
        "200":
          description: Progress view
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Progress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /candidates/me/consents/status:
    get:
      tags: [Candidates]
      summary: Get current consent requirements and acceptance state
      x-roles: [candidate]
      responses:
        "200":
          description: Current server-owned policy versions and acceptance state
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      type: object
                      required: [purpose, policyVersion, accepted]
                      properties:
                        purpose:
                          type: string
                          enum: [resume_processing, external_model_processing, analytics]
                        policyVersion:
                          type: string
                        accepted:
                          type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /candidates/me/consents:
    get:
      tags: [Candidates]
      summary: Get the candidate's consent state
      x-roles: [candidate]
      responses:
        "200":
          description: Consent history for the authenticated candidate
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Consent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [Candidates]
      summary: Grant or revoke consent for a named purpose
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, granted]
              properties:
                purpose:
                  type: string
                  enum: [resume_processing, external_model_processing, analytics]
                granted:
                  type: boolean
      responses:
        "200":
          description: Consent state recorded
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Consent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /candidates/me/export:
    get:
      tags: [Candidates]
      summary: Export the candidate's data
      description: Draft export representation; JSON response is proposed pending instructor confirmation.
      x-roles: [candidate]
      responses:
        "200":
          description: Downloadable export (format subject to approval)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportVersion:
                    type: string
                  generatedAt:
                    type: string
                    format: date-time
                  data:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /candidates/me/data:
    delete:
      tags: [Candidates]
      summary: Request deletion of the candidate's account data
      x-roles: [candidate]
      responses:
        "202":
          description: Deletion accepted and audit metadata retained according to policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /reviews/request:
    post:
      tags: [Reviews]
      summary: Request coach review of an owned AI result
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetType, targetId, reason]
              properties:
                targetType:
                  type: string
                  enum: [job_match, resume_suggestion, interview_evaluation]
                targetId:
                  $ref: "#/components/schemas/ObjectId"
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: Review request queued
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/ReviewItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /reviews/pending:
    get:
      tags: [Reviews]
      summary: List pending reviews available to the authenticated coach
      x-roles: [coach]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Review queue page
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ReviewItem"
                      nextCursor:
                        type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /reviews/{reviewId}:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ObjectId"
    get:
      tags: [Reviews]
      summary: Get a review item within the caller's permitted scope
      responses:
        "200":
          description: Review detail
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/ReviewItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /reviews/{reviewId}/decision:
    post:
      tags: [Reviews]
      summary: Record an assigned coach's review decision
      x-roles: [coach]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: Decision recorded and audited
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/ReviewItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/users:
    get:
      tags: [Administration]
      summary: List user and role metadata
      description: Does not return resumes, answers, or other candidate content.
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: User metadata page
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
                      nextCursor:
                        type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/config:
    get:
      tags: [Administration]
      summary: Read active non-secret configuration versions
      x-roles: [admin]
      responses:
        "200":
          description: Versioned scoring, rubric, and review settings
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/AdminConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags: [Administration]
      summary: Update validated versioned thresholds
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reviewThresholds:
                  type: object
                  additionalProperties: false
                  properties:
                    lowConfidenceThreshold:
                      type: number
                      minimum: 0
                      maximum: 1
                    randomQualitySampleRate:
                      type: number
                      minimum: 0
                      maximum: 1
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: New configuration version activated
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/AdminConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/audit-logs:
    get:
      tags: [Administration]
      summary: Query restricted audit metadata
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Audit log page without candidate content
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [action, resourceType, createdAt, requestId]
                          properties:
                            actorUserId:
                              oneOf:
                                - $ref: "#/components/schemas/ObjectId"
                                - type: "null"
                            action:
                              type: string
                            resourceType:
                              type: string
                            resourceId:
                              oneOf:
                                - $ref: "#/components/schemas/ObjectId"
                                - type: "null"
                            createdAt:
                              type: string
                              format: date-time
                            requestId:
                              type: string
                      nextCursor:
                        type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor returned by the preceding page.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ResumeId:
      name: resumeId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
  schemas:
    ObjectId:
      type: string
      pattern: "^[0-9a-fA-F]{24}$"
      examples: ["665000000000000000000001"]
    SuccessObject:
      type: object
      required: [success, data]
      properties:
        success:
          const: true
        data:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [success, error, requestId]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        requestId:
          type: string
    User:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        email:
          type: string
          format: email
        role:
          type: string
          enum: [candidate, coach, admin]
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
    JobAccepted:
      type: object
      required: [jobId, status, statusUrl]
      properties:
        jobId:
          $ref: "#/components/schemas/ObjectId"
        status:
          const: queued
        statusUrl:
          type: string
        jobDescriptionId:
          $ref: "#/components/schemas/ObjectId"
    JobAcceptedResponse:
      type: object
      required: [success, data]
      properties:
        success:
          const: true
        data:
          $ref: "#/components/schemas/JobAccepted"
    JobStatus:
      type: object
      required: [jobId, type, status, progress, createdAt, updatedAt]
      properties:
        jobId:
          $ref: "#/components/schemas/ObjectId"
        type:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        resultType:
          type: [string, "null"]
        resultId:
          oneOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: "null"
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    JobTextRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 20
          maxLength: 200000
    Resume:
      type: object
      required: [id, originalFileName, contentType, sizeBytes, textExtractionStatus, parseStatus, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        originalFileName:
          type: string
        contentType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        sizeBytes:
          type: integer
          minimum: 1
        parseStatus:
          type: string
          enum: [uploaded, queued, parsed, failed]
        textExtractionStatus:
          type: string
          enum: [extracted, empty]
        extractedText:
          type: string
        title:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResumeCorrection:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        notes:
          type: string
          maxLength: 2000
    JobDescription:
      type: object
      required: [id, sourceType, analysisStatus, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        sourceType:
          type: string
          enum: [paste, upload]
        analysisStatus:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        text:
          type: string
          description: Included only for a single-description response
        roleTitle:
          type: [string, "null"]
        requiredSkills:
          type: array
          items:
            type: object
            required: [name, evidenceSnippet]
            properties:
              name:
                type: string
              evidenceSnippet:
                type: string
        preferredSkills:
          type: array
          items:
            type: object
            required: [name, evidenceSnippet]
            properties:
              name:
                type: string
              evidenceSnippet:
                type: string
        createdAt:
          type: string
          format: date-time
    MatchResult:
      type: object
      required: [id, score, scoreBreakdown, skillResults, disclaimer, scoreConfigVersion, reviewStatus]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        score:
          type: integer
          minimum: 0
          maximum: 100
        scoreBreakdown:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 100
        skillResults:
          type: array
          items:
            type: object
            required: [skill, status, evidence]
            properties:
              skill:
                type: string
              status:
                type: string
                enum: [matched, partial, no_evidence_found]
              evidence:
                type: array
                items:
                  type: string
        disclaimer:
          type: string
        scoreConfigVersion:
          type: string
        reviewStatus:
          type: string
          enum: [not_required, pending_review, approved, edited, rejected]
    SkillGapResult:
      type: object
      required: [id, categories]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        categories:
          type: array
          items:
            type: object
            required: [name, items]
            properties:
              name:
                type: string
              items:
                type: array
                items:
                  type: object
                  required: [skill, evidenceStatus, suggestedActions]
                  properties:
                    skill:
                      type: string
                    evidenceStatus:
                      type: string
                      enum: [partial, no_evidence_found]
                    suggestedActions:
                      type: array
                      items:
                        type: string
    ResumeSuggestion:
      type: object
      required: [id, resumeId, originalText, proposedText, reason, status, reviewStatus]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        resumeId:
          $ref: "#/components/schemas/ObjectId"
        originalText:
          type: string
        proposedText:
          type: string
        reason:
          type: string
        evidence:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, accepted, rejected]
        reviewStatus:
          type: string
          enum: [not_required, pending_review, approved, edited, rejected]
    MatchRequest:
      type: object
      additionalProperties: false
      required: [resumeId, jobDescriptionId]
      properties:
        resumeId:
          $ref: "#/components/schemas/ObjectId"
        jobDescriptionId:
          $ref: "#/components/schemas/ObjectId"
    OptimizeResumeRequest:
      allOf:
        - $ref: "#/components/schemas/MatchRequest"
    InterviewGenerateRequest:
      type: object
      additionalProperties: false
      required: [jobDescriptionId]
      properties:
        jobDescriptionId:
          $ref: "#/components/schemas/ObjectId"
        resumeId:
          $ref: "#/components/schemas/ObjectId"
        questionCount:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
    StartInterviewRequest:
      type: object
      additionalProperties: false
      required: [jobDescriptionId]
      properties:
        jobDescriptionId:
          $ref: "#/components/schemas/ObjectId"
        questionSetId:
          $ref: "#/components/schemas/ObjectId"
    InterviewQuestion:
      type: object
      required: [id, text, category, index]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        text:
          type: string
        category:
          type: string
        index:
          type: integer
          minimum: 0
    InterviewSession:
      type: object
      required: [id, status, currentIndex, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        status:
          type: string
          enum: [in_progress, evaluating, completed, abandoned]
        currentIndex:
          type: integer
          minimum: 0
        currentQuestion:
          oneOf:
            - $ref: "#/components/schemas/InterviewQuestion"
            - type: "null"
        createdAt:
          type: string
          format: date-time
    AnswerEvaluation:
      type: object
      required: [rubricVersion, scores, strengths, improvements, confidence]
      properties:
        rubricVersion:
          type: string
        scores:
          type: object
          required: [relevance, completeness, reasoning, examples, communication]
          properties:
            relevance:
              type: number
              minimum: 0
              maximum: 4
            completeness:
              type: number
              minimum: 0
              maximum: 4
            reasoning:
              type: number
              minimum: 0
              maximum: 4
            examples:
              type: number
              minimum: 0
              maximum: 4
            communication:
              type: number
              minimum: 0
              maximum: 4
        strengths:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        exampleAnswer:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reviewStatus:
          type: string
          enum: [not_required, pending_review, approved, edited, rejected]
    InterviewResults:
      type: object
      required: [sessionId, status, evaluations, reviewStatus]
      properties:
        sessionId:
          $ref: "#/components/schemas/ObjectId"
        status:
          type: string
          enum: [completed, evaluating]
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/AnswerEvaluation"
        reviewStatus:
          type: string
          enum: [not_required, pending_review, approved, edited, rejected]
    Progress:
      type: object
      required: [completedInterviews, averageRubricScores, updatedAt]
      properties:
        completedInterviews:
          type: integer
          minimum: 0
        averageRubricScores:
          type: object
          additionalProperties:
            type: number
        practiceAreas:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
    Consent:
      type: object
      required: [purpose, policyVersion, granted, recordedAt, source]
      properties:
        purpose:
          type: string
          enum: [resume_processing, external_model_processing, analytics]
        policyVersion:
          type: string
        granted:
          type: boolean
        recordedAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        source:
          type: string
          enum: [registration, upload, settings]
    ReviewItem:
      type: object
      required: [id, targetType, targetId, status, flags, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        targetType:
          type: string
          enum: [job_match, resume_suggestion, interview_evaluation]
        targetId:
          $ref: "#/components/schemas/ObjectId"
        status:
          type: string
          enum: [pending_review, in_review, approved, edited, rejected]
        flags:
          type: array
          items:
            type: string
        riskLevel:
          type: string
          enum: [low, medium, high]
        assignedCoachId:
          oneOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: "null"
        decisionReason:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    ReviewDecision:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [approve, edit, reject]
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        editedOutput:
          type: object
          additionalProperties: true
    AdminConfig:
      type: object
      required: [scoringVersion, rubricVersion, reviewThresholdsVersion]
      properties:
        scoringVersion:
          type: string
        rubricVersion:
          type: string
        reviewThresholdsVersion:
          type: string
        reviewThresholds:
          type: object
          properties:
            lowConfidenceThreshold:
              type: number
            randomQualitySampleRate:
              type: number
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated caller is not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or unavailable to caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate resource or invalid state transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Upload exceeds configured size limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Unsupported or invalid file type
      content:
